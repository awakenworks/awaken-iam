[workspace]
resolver = "2"
members = [
    "crates/awaken-iam",
    "crates/awaken-iam-contract",
    "crates/awaken-iam-core",
    "crates/awaken-iam-preset",
    "crates/awaken-iam-client",
    "crates/awaken-iam-server",
    "crates/awaken-iam-guard",
    "crates/awaken-iam-host",
    "xtask",
]

[workspace.package]
version = "0.1.2-dev"
edition = "2024"
rust-version = "1.96"
license = "MIT OR Apache-2.0"
repository = "https://github.com/AwakenWorks/awaken-iam"
authors = ["The Awaken Authors"]
publish = false

[workspace.dependencies]
awaken-iam = { path = "crates/awaken-iam", version = "0.1.2-dev" }
awaken-iam-contract = { path = "crates/awaken-iam-contract", version = "0.1.2-dev" }
awaken-iam-core = { path = "crates/awaken-iam-core", version = "0.1.2-dev" }
awaken-iam-preset = { path = "crates/awaken-iam-preset", version = "0.1.2-dev" }
awaken-iam-client = { path = "crates/awaken-iam-client", version = "0.1.2-dev" }
awaken-iam-server = { path = "crates/awaken-iam-server", version = "0.1.2-dev" }
awaken-iam-guard = { path = "crates/awaken-iam-guard", version = "0.1.2-dev" }
awaken-iam-host = { path = "crates/awaken-iam-host", version = "0.1.2-dev" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing"] }

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
correctness = { level = "deny", priority = -1 }
