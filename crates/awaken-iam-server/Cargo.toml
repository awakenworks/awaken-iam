[package]
name = "awaken-iam-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
awaken-iam-contract.workspace = true
awaken-iam-core.workspace = true
awaken-iam-client.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
base64 = "0.22"
sha2 = "0.10"
ed25519-dalek = "2"
rusqlite = { version = "0.40.1", features = ["bundled"] }
postgres = "0.19.14"
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "signal"] }
reqwest = { version = "0.12", default-features = false, features = [
    "blocking",
    "json",
    "rustls-tls",
] }

[dev-dependencies]
awaken-iam-contract.workspace = true
awaken-iam-core.workspace = true
awaken-iam-client.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros"] }
tower = { version = "0.5", features = ["util"] }

[[bin]]
name = "iam-daemon"
path = "src/bin/iam-daemon.rs"

[lints]
workspace = true
