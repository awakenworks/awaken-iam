[package]
name = "awaken-iam-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
awaken-iam-contract.workspace = true
awaken-iam-core.workspace = true
awaken-iam-client.workspace = true
# The shared, scope-partitioned migration mechanism (bundles, checksums, the
# plan() decision, dialect-token rendering, the fail-closed ledger fence). Only
# the driver-agnostic pure core is used (default features): awaken-iam's own
# backends drive it with their sync `postgres` / rusqlite 0.40 clients, whereas
# the crate's optional `postgres`/`sqlite` runner shells target async sqlx and
# rusqlite 0.32 — different driver generations, so the shells are deliberately
# left off.
awaken-scoped-migration = { git = "https://github.com/awakenworks/awaken-foundation.git", rev = "f90f6bcf6b2b2d98610dfc5dfdaa9f9c5ccd8494" }
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
async-trait = "0.1"
base64 = "0.22"
sha2 = "0.10"
ed25519-dalek = "2"
rusqlite = { version = "0.40.1", features = ["bundled"] }
postgres = "0.19.14"
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "signal"] }
reqwest = { version = "0.12", default-features = false, features = [
    "blocking",
    "json",
    "rustls-tls",
] }

[dev-dependencies]
awaken-iam-contract.workspace = true
awaken-iam-core.workspace = true
awaken-iam-client.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros"] }
tower = { version = "0.5", features = ["util"] }

[[bin]]
name = "iam-daemon"
path = "src/bin/iam-daemon.rs"

[lints]
workspace = true
