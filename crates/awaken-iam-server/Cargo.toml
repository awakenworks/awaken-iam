[package]
name = "awaken-iam-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
awaken-iam-contract.workspace = true
awaken-iam-core.workspace = true
awaken-iam-preset.workspace = true
awaken-iam-client.workspace = true
# The shared, scope-partitioned migration mechanism (bundles, checksums, the
# plan() decision, dialect-token rendering, the fail-closed ledger fence). Only
# the driver-agnostic pure core is used (default features): awaken-iam's own
# backends drive it with their sync `postgres` / rusqlite clients, whereas the
# crate's optional `postgres` runner targets async sqlx (the canonical SQLite
# shell lives in the sibling crate `awaken-scoped-migration-sqlite`, foundation
# ADR-0005), so the runner is deliberately left off.
awaken-scoped-migration = { version = "=0.1.0-dev", git = "https://github.com/awakenworks/awaken-foundation", rev = "bc863fd83935b24ce73ca27014f35440321ff906" }
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
async-trait = "0.1"
base64 = "0.22"
sha2 = "0.10"
getrandom = "0.3"
time.workspace = true
ed25519-dalek = "2"
# A *range*, deliberately not a hard `^0.x` pin: rusqlite pulls the native
# `links = "sqlite3"` crate libsqlite3-sys, of which a graph may contain exactly
# one version, so a hard pin here would deadlock any embedding graph that already
# resolves a different rusqlite (mirrors awaken-foundation ADR-0005; the sqlite
# store only uses API stable across the whole range). The floor is compile- and
# test-guarded by the `rusqlite-floor` CI job; move both together.
rusqlite = { version = ">=0.32, <0.41", features = ["bundled"] }
postgres = "0.19.14"
r2d2 = "0.8"
r2d2_postgres = "0.18"
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "signal"] }
reqwest = { version = "0.12", default-features = false, features = [
    "blocking",
    "json",
    "rustls-tls",
] }
url = "2"

[dev-dependencies]
awaken-iam-contract.workspace = true
awaken-iam-core.workspace = true
awaken-iam-client.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros"] }
tower = { version = "0.5", features = ["util"] }

[[bin]]
name = "iam-daemon"
path = "src/bin/iam-daemon.rs"

[lints]
workspace = true
