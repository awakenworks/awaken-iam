[package]
name = "awaken-iam-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true
description = "Assembly + auth middleware layer for embedding or connecting Awaken IAM in a product host."

[dependencies]
awaken-iam-contract.workspace = true
awaken-iam-core.workspace = true
awaken-iam-client = { workspace = true, features = ["http"] }
awaken-iam-server.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
axum = "0.8"
tower = { version = "0.5", features = ["util"] }
tokio = { version = "1", features = ["rt"] }
reqwest = { version = "0.12", default-features = false, features = [
    "blocking",
    "json",
    "rustls-tls",
] }

[dev-dependencies]
awaken-iam-contract.workspace = true
awaken-iam-core.workspace = true
awaken-iam-client.workspace = true
awaken-iam-server.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
axum = "0.8"

[lints]
workspace = true
