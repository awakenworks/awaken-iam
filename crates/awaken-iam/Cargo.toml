[package]
name = "awaken-iam"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[features]
# Forward the client's concrete reqwest HTTP `AuthzTransport`, so a consumer of
# the facade can opt into the remote transport without depending on the client
# crate directly.
http = ["awaken-iam-client/http"]

[dependencies]
awaken-iam-contract.workspace = true
awaken-iam-core.workspace = true
awaken-iam-preset.workspace = true
awaken-iam-client.workspace = true
awaken-iam-server.workspace = true

[dev-dependencies]
# The capability-delegation integration test drives the now-async token minting
# seam, so it runs on a Tokio test runtime.
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true
