[package]
name = "awaken-iam-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[features]
# Concrete HTTP `AuthzTransport` built on reqwest's blocking client. Off by
# default so a consumer that injects its own transport (or runs local mode)
# pays for none of the HTTP stack.
http = ["dep:reqwest", "dep:serde"]
# Shared on-disk credential cache: login-once, reuse-until-expiry.
# Persists at ${XDG_CONFIG_HOME:-~/.config}/awaken/credentials.json (mode 0600).
credential-cache = ["dep:serde", "dep:serde_json"]
# Native public-client Authorization Code + PKCE over a loopback callback.
# Reuses the HTTP transport dependencies and the canonical credential cache.
desktop-oauth = [
    "http",
    "credential-cache",
    "dep:base64",
    "dep:getrandom",
    "dep:sha2",
    "dep:url",
]

[dependencies]
awaken-iam-contract.workspace = true
awaken-iam-core.workspace = true
thiserror.workspace = true
reqwest = { version = "0.12", default-features = false, features = [
    "blocking",
    "json",
    "rustls-tls",
], optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
base64 = { version = "0.22", optional = true }
getrandom = { version = "0.3", optional = true }
sha2 = { version = "0.10", optional = true }
url = { version = "2", optional = true }

[lints]
workspace = true
