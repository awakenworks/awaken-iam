patterns:
  - name: Awaken API token
    regex: sk-awaken-[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}
    comments: >
      Awaken management/service API token. These are minted by awaken-iam and
      authenticate machine callers against the Awaken IAM surface. They are
      distinct from Anthropic provider keys (sk-ant-…).
