name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governance:
    name: Governance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tracked files
        id: files
        run: echo "list=$(git ls-files)" >> "$GITHUB_OUTPUT"
      - name: Root docs
        run: python3 scripts/ci/check_root_docs.py ${{ steps.files.outputs.list }}
      - name: Doc links
        run: python3 scripts/ci/check_doc_links.py ${{ steps.files.outputs.list }}
      - name: ADR metadata
        run: python3 scripts/ci/check_adr.py ${{ steps.files.outputs.list }}
      - name: ADR immutability
        run: |
          python3 scripts/ci/check_adr_immutability.py --self-test
          python3 scripts/ci/check_adr_immutability.py --base "origin/${{ github.base_ref || 'main' }}"
      - name: Secrets
        run: python3 scripts/ci/check_secrets.py ${{ steps.files.outputs.list }}
      - name: Hidden Unicode
        run: python3 scripts/ci/check_hidden_unicode.py ${{ steps.files.outputs.list }}
      - name: Open-core boundary
        run: |
          python3 scripts/ci/check_open_core_boundary.py --self-test
          python3 scripts/ci/check_open_core_boundary.py

  msrv:
    name: MSRV (1.96)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check on the minimum supported Rust version
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          cargo +1.96.0 check --workspace --locked

  # awaken-iam-server declares rusqlite as a range (`>=0.32, <0.41`) so that
  # embedding graphs with their own rusqlite can unify on one libsqlite3-sys
  # (see the comment on the dependency). Regular jobs resolve the range's top;
  # this job pins the lockfile to the floor so a 0.40-only API can't sneak in
  # and silently break consumers that resolve low.
  rusqlite-floor:
    name: rusqlite floor (0.32)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: rustup show
      - name: Pin rusqlite to the range floor
        run: cargo update -p rusqlite --precise 0.32.1
      - name: Test the sqlite backend at the floor
        run: cargo test -p awaken-iam-server

  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: rustup show
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D clippy::correctness
      - name: Test
        run: cargo test --workspace
      - name: cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2
